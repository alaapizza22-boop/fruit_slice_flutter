name: orchard_slice
description: Fruit Slice - a fruit slicing game.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.9.0
  webview_flutter_android: any
  vibration: ">=2.0.0"

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: false
  assets:
    - assets/game/index.html
    - assets/app_config.json
    - assets/icon.png
    - assets/apple.png
    - assets/brand_fruit.png
    - assets/brand_slice.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
